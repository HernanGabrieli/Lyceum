<!DOCTYPE html>
<html lang="en" data-skin="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lyceum — five minutes a day</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0B1426;--bg2:#0E1930;--panel:#121E39;--panel2:#182648;--line:rgba(201,206,214,.14);
  --ink:#E6E9EE;--ink2:#C9CED6;--mute:#8A94A6;--accent:#00D4FF;--accent-ink:#0B1426;--accent-soft:rgba(0,212,255,.12);
  --red:#FF3B5C;--shadow:0 10px 28px rgba(0,0,0,.35);--backdrop:#05090F;
  --serif:"Book Antiqua","Palatino Linotype",Palatino,"Iowan Old Style","Times New Roman",serif;
  --sans:Calibri,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme:light;--bg:#DDE1E7;--bg2:#E8EBEF;--panel:#F4F5F7;--panel2:#FFFFFF;--line:rgba(11,20,38,.12);
    --ink:#0B1426;--ink2:#1A2846;--mute:#5B6579;--accent:#0088BE;--accent-ink:#FFFFFF;--accent-soft:rgba(0,136,190,.12);
    --red:#D4183A;--shadow:0 10px 28px rgba(11,20,38,.14);--backdrop:#0B1426;
  }
}
:root[data-theme="light"]{
  color-scheme:light;--bg:#DDE1E7;--bg2:#E8EBEF;--panel:#F4F5F7;--panel2:#FFFFFF;--line:rgba(11,20,38,.12);
  --ink:#0B1426;--ink2:#1A2846;--mute:#5B6579;--accent:#0088BE;--accent-ink:#FFFFFF;--accent-soft:rgba(0,136,190,.12);
  --red:#D4183A;--shadow:0 10px 28px rgba(11,20,38,.14);--backdrop:#0B1426;
}
:root[data-skin="night"]{
  color-scheme:dark;--bg:#0B1426;--bg2:#0E1930;--panel:#121E39;--panel2:#182648;--line:rgba(201,206,214,.14);
  --ink:#E6E9EE;--ink2:#C9CED6;--mute:#8A94A6;--accent:#00D4FF;--accent-ink:#0B1426;--accent-soft:rgba(0,212,255,.12);
  --red:#FF3B5C;--shadow:0 10px 28px rgba(0,0,0,.35);--backdrop:#05090F;
}
:root[data-skin="silver"]{
  color-scheme:light;--bg:#DDE1E7;--bg2:#E8EBEF;--panel:#F4F5F7;--panel2:#FFFFFF;--line:rgba(11,20,38,.12);
  --ink:#0B1426;--ink2:#1A2846;--mute:#5B6579;--accent:#0088BE;--accent-ink:#FFFFFF;--accent-soft:rgba(0,136,190,.12);
  --red:#D4183A;--shadow:0 10px 28px rgba(11,20,38,.14);--backdrop:#0B1426;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

.stage{height:100%;display:flex;justify-content:center;align-items:stretch;background:var(--bg)}
.device{position:relative;width:100%;height:100%;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
@media (min-width:720px){
  body{background:var(--backdrop)}
  .stage{background:var(--backdrop);align-items:center;padding:24px}
  .device{width:414px;height:min(880px,100%);border-radius:44px;border:10px solid #182034;box-shadow:0 30px 80px rgba(0,0,0,.6)}
}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 4px;flex:0 0 auto}
.brand{font-family:var(--serif);font-size:21px;letter-spacing:.02em;color:var(--ink)}
.brand small{display:block;font-family:var(--sans);font-size:11px;letter-spacing:0;color:var(--mute);margin-top:-2px}
.hdr-right{display:flex;align-items:center;gap:12px}
.streak{display:flex;align-items:center;gap:4px;font-size:13.5px;color:var(--mute)}
.streak.hot{color:var(--accent)}
.streak.risk{color:var(--red)}
.streak svg{width:16px;height:16px}
.ringwrap{position:relative;width:38px;height:38px}
.ringwrap svg{width:38px;height:38px;transform:rotate(-90deg)}
.ringwrap .bgc{stroke:var(--line);fill:none;stroke-width:3}
.ringwrap .fgc{stroke:var(--accent);fill:none;stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset .4s ease}
.ringwrap .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-size:13px;color:var(--ink)}
.langs{display:flex;gap:4px;padding:2px 14px 6px;flex:0 0 auto;border-bottom:1px solid var(--line)}
.lb{flex:1;background:none;border:0;border-bottom:2px solid transparent;color:var(--mute);font-size:12px;letter-spacing:.08em;padding:6px 0 5px;border-radius:0}
.lb.on{color:var(--accent);border-bottom-color:var(--accent)}
.lanote{font-size:12px;color:var(--mute);padding:8px 4px 0}

/* main scroll area */
.main{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 14px 28px;scrollbar-width:none}
.main::-webkit-scrollbar{display:none}
.view{display:none}.view.on{display:block}
h2.sec{font-family:var(--serif);font-weight:400;font-size:19px;margin:22px 2px 10px;color:var(--ink)}
h2.sec:first-child{margin-top:10px}
.sub{color:var(--mute);font-size:13.5px;margin:-6px 2px 12px}

/* tabs */
.tabs{display:flex;border-top:1px solid var(--line);background:var(--bg2);flex:0 0 auto}
.tab{flex:1;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mute);font-size:11px;background:none;border:0}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--accent)}

/* today hero */
.hero{padding:8px 4px 2px}
.date{color:var(--mute);font-size:13.5px}
.goal{display:flex;align-items:center;gap:14px;margin:10px 0 4px}
.goal .big{font-family:var(--serif);font-size:30px;line-height:1.1;color:var(--ink);white-space:nowrap}
.goal .big span{font-size:17px;color:var(--mute)}
.goal .txt{font-size:13.5px;color:var(--mute);margin-top:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 4px;scrollbar-width:none;margin:8px -2px 2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--ink2);border-radius:999px;padding:7px 13px;font-size:13px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tuned{font-size:12.5px;color:var(--mute);padding:2px 4px 0}
.tuned b{color:var(--ink2);font-weight:600}

/* idea cards: two materials */
.card{border-radius:20px;padding:16px 16px 8px;margin:12px 0;position:relative}
.card.cv{background:#101C36;color:#E6E9EE;border:1px solid rgba(201,206,214,.14)}
.card.ca{background:linear-gradient(140deg,#E6E9EE 0%,#F6F7F9 42%,#C5CBD5 100%);color:#0B1426;box-shadow:var(--shadow)}
:root[data-skin="silver"] .card.cv{box-shadow:var(--shadow);border-color:transparent}
.who{display:flex;align-items:center;gap:10px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-size:14px;flex:0 0 auto}
.av.v{background:#0B1426;color:#00D4FF;box-shadow:inset 0 0 0 1.5px #00D4FF}
.av.a{background:linear-gradient(140deg,#F2F4F7,#B9C0CB);color:#0B1426}
.ca .av.a{background:#0B1426;color:#E6E9EE}
.nm{font-weight:600;font-size:14px;line-height:1.2}
.rl{font-size:11.5px;opacity:.72;margin-top:2px}
.meta{margin-left:auto;display:flex;align-items:center;gap:6px;flex:0 0 auto}
.era{font-size:11.5px;padding:3px 9px;border-radius:999px;white-space:nowrap}
.cv .era{border:1px solid rgba(201,206,214,.25);color:#C9CED6}
.ca .era{border:1px solid rgba(11,20,38,.28);color:#1A2846}
.era.read{padding-left:7px}
.era.read::before{content:"✓ "}
.vchk{width:18px;height:18px;border-radius:50%;background:#FF3B5C;color:#fff;display:grid;place-items:center;flex:0 0 auto}
.vchk svg{width:12px;height:12px}
.newb{font-size:10.5px;letter-spacing:.04em;padding:3px 7px;border-radius:999px;background:#00D4FF;color:#0B1426;font-weight:600}
.ca .newb{background:#0B1426;color:#E6E9EE}
.h{font-family:var(--serif);font-weight:400;font-size:22px;line-height:1.22;margin:14px 0 8px}
.b{font-size:15px;line-height:1.52;margin:0}
.cv .b{color:#C9CED6}
.ca .b{color:#1A2846}
.src{font-size:12.5px;font-style:italic;margin-top:10px}
.cv .src{color:#8A94A6}
.ca .src{color:#4C5669}
.tags{margin-top:6px}
.tg{display:inline-block;font-size:11.5px;padding:3px 9px;border-radius:999px;margin:6px 6px 0 0;border:0}
.cv .tg{background:rgba(0,212,255,.12);color:#00D4FF}
.ca .tg{background:rgba(11,20,38,.08);color:#0B1426}
.deep{display:none;margin-top:12px;padding:11px 12px;border-radius:0 12px 12px 0;font-size:14px;line-height:1.5}
.cv .deep{border-left:2px solid #00D4FF;background:rgba(0,212,255,.1)}
.ca .deep{border-left:2px solid #0B1426;background:rgba(11,20,38,.06)}
.deep b{display:block;font-weight:600;margin-bottom:3px}
.card.open .deep{display:block}
.acts{display:flex;gap:2px;margin-top:10px;padding-top:6px}
.cv .acts{border-top:1px solid rgba(201,206,214,.14)}
.ca .acts{border-top:1px solid rgba(11,20,38,.14)}
.ab{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:none;border:0;font-size:12.5px;padding:8px 2px;border-radius:10px}
.ab svg{width:18px;height:18px}
.ab span{white-space:nowrap}
.cv .ab{color:#8A94A6}.cv .ab.on{color:#00D4FF}
.ca .ab{color:#4C5669}.ca .ab.on{color:#0077A8}
.card.open .ab.deeper svg{transform:rotate(180deg)}
.hg{width:20px;height:20px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-family:var(--serif);font-size:13px;line-height:1;font-weight:700}
.ab.on .hg{border-color:transparent}
.cv .ab.on .hg{background:#00D4FF;color:#0B1426}
.ca .ab.on .hg{background:#0B1426;color:#E6E9EE}

/* diptych */
.duo{border-radius:20px;overflow:hidden;background:#101C36;border:1px solid rgba(201,206,214,.14);margin:12px 0;color:#E6E9EE}
:root[data-skin="silver"] .duo{box-shadow:var(--shadow);border-color:transparent}
.duo-h{padding:12px 16px 0;font-size:13px;color:#8A94A6}
.duo-h em{font-style:normal;font-family:var(--serif);font-size:17px;color:#E6E9EE;margin-left:6px}
.duo-row{display:flex;position:relative;margin-top:10px}
.side{flex:1;padding:14px 14px 16px;min-width:0;border:0;text-align:left;font-family:inherit}
.side.then{background:linear-gradient(140deg,#E6E9EE 0%,#F6F7F9 42%,#C5CBD5 100%);color:#0B1426;padding-right:28px}
.side.now{background:#101C36;color:#E6E9EE;padding-left:30px}
.duo.mini .side.then{padding-right:26px}.duo.mini .side.now{padding-left:28px}
.side .lbl{font-size:12px;opacity:.7}
.side .sw{font-weight:600;font-size:13.5px;margin-top:4px}
.side .si{font-family:var(--serif);font-size:17px;line-height:1.25;margin-top:6px}
.amp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;background:#00D4FF;color:#0B1426;display:grid;place-items:center;font-family:var(--serif);font-size:17px;box-shadow:0 0 0 4px #101C36}
.bridge{padding:12px 16px 14px;font-size:14px;line-height:1.5;color:#C9CED6;border-top:1px solid rgba(201,206,214,.14)}
.duo.mini .side{padding-top:12px;padding-bottom:14px}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 14px;scrollbar-width:none;margin:0 -2px}
.rail::-webkit-scrollbar{display:none}
.rail .duo{flex:0 0 94%;scroll-snap-align:center;margin:0}
.dots{display:flex;justify-content:center;gap:6px;margin:-4px 0 8px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}

/* explore */
.search{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:10px 0 4px}
.search svg{width:18px;height:18px;color:var(--mute);flex:0 0 auto}
.search input{flex:1;background:none;border:0;color:var(--ink);font-size:15px;outline:none;min-width:0}
.search input::placeholder{color:var(--mute)}
.seg{display:flex;background:var(--panel);border-radius:12px;padding:3px;margin:10px 0 4px}
.seg button{flex:1;text-align:center;padding:8px;border-radius:10px;font-weight:600;font-size:13px;color:var(--mute);background:none;border:0}
.seg button.on{background:var(--panel2);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 6px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.tile .av{width:44px;height:44px;font-size:15px}
.tile .tn{font-size:12.5px;font-weight:600;line-height:1.2;color:var(--ink)}
.tile .tc{font-size:11px;color:var(--mute)}
.row{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;margin-bottom:8px;text-align:left}
.row .rn{font-family:var(--serif);font-size:17px;color:var(--ink)}
.row .rc{font-size:12.5px;color:var(--mute);margin-top:2px}
.row svg{width:18px;height:18px;color:var(--mute);flex:0 0 auto}
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--accent);font-size:14px;padding:12px 0 2px}
.back svg{width:18px;height:18px}
.empty{color:var(--mute);font-size:14px;padding:18px 4px;line-height:1.5}

/* buttons, stats */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:11px 16px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:14px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.block{width:100%}
.btn.danger{color:var(--red);border-color:transparent;background:transparent}
.btn svg{width:18px;height:18px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat .n{font-family:var(--serif);font-size:30px;line-height:1;color:var(--ink)}
.stat .l{font-size:12.5px;color:var(--mute);margin-top:6px}
.pref{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 2px;border-bottom:1px solid var(--line)}
.pref .pl{font-size:15px}
.pref .ph{font-size:12.5px;color:var(--mute);margin-top:2px}
.pills{display:flex;gap:6px;flex:0 0 auto}
.pill{border:1px solid var(--line);background:transparent;color:var(--ink2);border-radius:999px;padding:6px 12px;font-size:13px}
.pill.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.about{color:var(--mute);font-size:12.5px;line-height:1.5;padding:16px 2px}
.vline{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);padding:10px 2px 0}

/* onboarding, sheet, toast */
.ob{position:absolute;inset:0;background:var(--bg);z-index:30;display:none;flex-direction:column;padding:34px 24px 24px;overflow:auto}
.ob.on{display:flex}
.ob .wm{font-family:var(--serif);font-size:40px;color:var(--ink)}
.ob .tag{font-family:var(--serif);font-size:19px;line-height:1.35;color:var(--ink2);margin:14px 0 26px}
.ob .q{font-size:15px;color:var(--ink);margin-bottom:10px}
.obchips{display:flex;flex-wrap:wrap;gap:8px}
.ob .foot{margin-top:auto;padding-top:26px;display:flex;flex-direction:column;gap:10px}
.sheetwrap{position:absolute;inset:0;background:rgba(5,9,15,.55);z-index:20;display:none;align-items:flex-end}
.sheetwrap.on{display:flex}
.sheet{width:100%;background:var(--bg2);border-radius:22px 22px 0 0;padding:16px 16px 18px;max-height:72%;overflow:auto}
.sheet h3{font-family:var(--serif);font-weight:400;font-size:19px;margin:4px 2px 12px;color:var(--ink)}
.sheet .row{margin-bottom:6px}
.sheet .row.on{border-color:var(--accent)}
.newrow{display:flex;gap:8px;margin-top:10px}
.newrow input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 12px;color:var(--ink);font-size:15px;min-width:0}
.toast{position:absolute;left:50%;bottom:74px;transform:translateX(-50%) translateY(8px);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:13.5px;opacity:0;pointer-events:none;transition:.22s;z-index:40;max-width:92%;display:flex;gap:12px;align-items:center;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{background:none;border:0;color:#0077A8;font-weight:600;padding:0}
:root[data-skin="silver"] .toast button{color:#00D4FF}
.end{color:var(--mute);font-size:13.5px;text-align:center;padding:18px 10px 8px;line-height:1.5}
</style>
</head>
<body>
<div class="stage"><div class="device" id="device">

  <div class="top">
    <div class="brand">Lyceum<small id="tagline">Five minutes a day</small></div>
    <div class="hdr-right">
      <div class="streak" id="streak"></div>
      <div class="ringwrap" id="ring"></div>
    </div>
  </div>
  <div class="langs" id="langs"></div>

  <div class="main" id="main">
    <section class="view" id="v-today"></section>
    <section class="view" id="v-explore"></section>
    <section class="view" id="v-dialogues"></section>
    <section class="view" id="v-stash"></section>
    <section class="view" id="v-you"></section>
    <section class="view" id="v-list"></section>
  </div>

  <nav class="tabs" id="tabs"></nav>

  <div class="ob" id="ob"></div>
  <div class="sheetwrap" id="sheetwrap"><div class="sheet" id="sheet"></div></div>
  <div class="toast" id="toast"></div>

</div></div>

<script>
/* ---------- languages ---------- */
const LANGS=[["it","ITA"],["en","ENG"],["es","ESP"],["la","LAT"]];

function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}

/* i18n helpers */
function T(k,vars){let s=(UI[S.lang]&&UI[S.lang][k]!==undefined)?UI[S.lang][k]:UI.en[k];if(vars)for(const x in vars)s=s.split("{"+x+"}").join(vars[x]);return s;}
const tn=k=>(TOPN[S.lang]&&TOPN[S.lang][k])||TOPN.en[k];
function tx(c){const t=L[S.lang]&&L[S.lang][c.id];if(!t)return{h:c.h,b:c.b,d:c.d,s:c.src};return{h:t[0]||c.h,b:t[1]||c.b,d:t[2]||c.d,s:t[3]||c.src};}
const tname=k=>(TNAME[S.lang]&&TNAME[S.lang][k])||THINKERS[k].n;
const trole=k=>(TROLE[S.lang]&&TROLE[S.lang][k])||THINKERS[k].r;
const stashName=s=>s.n||T("myStash");
function roman(n){const m=[[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]];let r="";for(const [v,s] of m){while(n>=v){r+=s;n-=v;}}return r;}
function dateLine(){
 const d=new Date();
 if(S.lang==="la"){const days=["Solis","Lunae","Martis","Mercurii","Iovis","Veneris","Saturni"],mons=["Ianuarii","Februarii","Martii","Aprilis","Maii","Iunii","Iulii","Augusti","Septembris","Octobris","Novembris","Decembris"];return "Dies "+days[d.getDay()]+", "+roman(d.getDate())+" "+mons[d.getMonth()];}
 const loc={it:"it-IT",en:"en-GB",es:"es-ES"}[S.lang]||"en-GB";
 const s=d.toLocaleDateString(loc,{weekday:"long",day:"numeric",month:"long"});return s.charAt(0).toUpperCase()+s.slice(1);
}

function seeded(str){let h=2166136261;for(const ch of str){h^=ch.charCodeAt(0);h=Math.imul(h,16777619);}return function(){h+=0x6D2B79F5;let t=h;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(arr,rnd){for(let i=arr.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}

/* ---------- ranking: H signals ---------- */
function affinity(){
 const tg={},th={};
 S.h.forEach(id=>{const c=byId(id);if(!c)return;c.tg.forEach(t=>tg[t]=(tg[t]||0)+1);th[c.t]=(th[c.t]||0)+1;});
 return {tg,th};
}
function score(c,aff){
 let s=0;
 if(S.filter==="foryou")c.tg.forEach(t=>{if(S.int.includes(t))s+=1;});
 c.tg.forEach(t=>s+=1.5*(aff.tg[t]||0));
 s+=2*(aff.th[c.t]||0);
 if(S.h.includes(c.id))s-=1;
 if(S.read.includes(c.id))s-=0.5;
 return s;
}
function tunedLabel(){
 const aff=affinity();
 const tops=Object.entries(aff.tg).sort((x,y)=>y[1]-x[1]).slice(0,2).map(x=>tn(x[0]));
 const ths=Object.entries(aff.th).sort((x,y)=>y[1]-x[1]).slice(0,2).map(x=>tname(x[0]));
 return tops.concat(ths).join(", ");
}

/* ---------- views ---------- */
const $=s=>document.querySelector(s);
let cur={tab:S.tab||"today",list:null};
let feedN=8;
let pendingSave=null;
let toastT=null;

function todayDuo(){const rnd=seeded("duo"+TODAY);return DUOS[Math.floor(rnd()*DUOS.length)];}

function feed(){
 const rnd=seeded("feed"+TODAY);
 let cs=CARDS.slice();
 if(S.filter==="valley")cs=cs.filter(c=>wing(c)==="v");
 else if(S.filter==="ancients")cs=cs.filter(c=>wing(c)==="a");
 shuffle(cs,rnd);
 const aff=affinity();
 const sc=new Map(cs.map(c=>[c.id,score(c,aff)]));
 cs.sort((x,y)=>sc.get(y.id)-sc.get(x.id));
 if(S.filter==="foryou"||S.filter==="all"){
  const a=cs.filter(c=>wing(c)==="a"),v=cs.filter(c=>wing(c)==="v"),out=[];let i=0;
  while(a.length||v.length){out.push(i%2===0?(v.shift()||a.shift()):(a.shift()||v.shift()));i++;}
  cs=out;
 }
 return cs;
}

 </div>`;
}

function renderHeader(){
 const n=countToday(),g=S.goal,p=Math.min(1,n/g),C=2*Math.PI*15.5;
 $("#ring").innerHTML=`<svg viewBox="0 0 38 38"><circle class="bgc" cx="19" cy="19" r="15.5"/><circle class="fgc" cx="19" cy="19" r="15.5" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-p)).toFixed(1)}"/></svg><div class="num">${n}</div>`;
 const sk=streakNow(),st=$("#streak");
 st.className="streak"+(sk>0?(S.last===TODAY?" hot":" risk"):"");
 st.innerHTML=I("flame")+`<span>${sk}</span>`;
 $("#tagline").textContent=T("tag");
 $("#langs").innerHTML=LANGS.map(([k,l])=>`<button class="lb${S.lang===k?" on":""}" data-act="lang" data-v="${k}">${l}</button>`).join("");
 document.documentElement.lang=S.lang;
}

function renderTabs(){
 const Tb=[["today","today","home"],["explore","explore","explore"],["dialogues","dialogues","duo"],["stash","stash","bm"],["you","you","you"]];
 const active=cur.tab==="list"?(cur.list.from||"today"):cur.tab;
 $("#tabs").innerHTML=Tb.map(([k,l,ic])=>`<button class="tab${active===k?" on":""}" data-act="tab" data-v="${k}">${I(ic)}<span>${T(l)}</span></button>`).join("");
}

function renderToday(){
 const n=countToday(),g=S.goal,sk=streakNow();
 const rem=g-n;
 let line=n>=g?T("goalDone"):(sk>0?T("streakLine",{s:sk,n:rem,ideas:rem===1?T("idea"):T("ideas")}):T("startLine",{g}));
 const chips=[["foryou","foryou"],["all","all"],["valley","valley"],["ancients","ancients"]];
 const cs=feed(),show=cs.slice(0,feedN);
 const tl=tunedLabel();
 $("#v-today").innerHTML=`${T("laNote")?`<div class="lanote">${esc(T("laNote"))}</div>`:""}<div class="hero"><div class="date">${esc(dateLine())}</div>
  <div class="goal"><div class="big">${n}<span> ${esc(T("ofIdeas",{g}))}</span></div><div class="txt">${esc(line)}</div></div></div>
  ${duoHTML(todayDuo(),true)}
  <div class="chips">${chips.map(([k,l])=>`<button class="chip${S.filter===k?" on":""}" data-act="filter" data-v="${k}">${T(l)}</button>`).join("")}</div>
  ${tl?`<div class="tuned">${esc(T("tuned",{x:""})).replace(/:\s*\.$/,"")}: <b>${esc(tl)}</b>.</div>`:""}
  <div id="feed">${show.map(cardHTML).join("")}</div>
  ${cs.length>feedN?`<button class="btn block" data-act="more">${esc(T("more",{n:Math.min(8,cs.length-feedN)}))}</button>`:`<div class="end">${esc(T("end"))}</div>`}`;
}

function renderExplore(q){
 q=(q||"").trim();
 const v=$("#v-explore");
 const mode=v.dataset.mode||"thinkers";
 let body="";
 if(q){
  const ql=q.toLowerCase();
  const hits=CARDS.filter(c=>{const x=tx(c);return (x.h+" "+x.b+" "+c.h+" "+c.b+" "+tname(c.t)+" "+THINKERS[c.t].n+" "+x.s+" "+c.tg.map(k=>tn(k)).join(" ")).toLowerCase().includes(ql);});
  body=hits.length?hits.slice(0,20).map(cardHTML).join(""):`<div class="empty">${esc(T("noMatch",{q}))}</div>`;
 }else if(mode==="thinkers"){
  const tiles=w=>Object.entries(THINKERS).filter(([k,t])=>t.w===w).map(([k,t])=>{const n=CARDS.filter(c=>c.t===k).length;return `<button class="tile" data-act="thinker" data-v="${k}"><div class="av ${t.w}">${t.i}</div><div class="tn">${esc(tname(k))}</div><div class="tc">${n} ${n===1?T("idea"):T("ideas")}</div></button>`;}).join("");
  body=`<h2 class="sec">${T("valley")}</h2><div class="grid">${tiles("v")}</div><h2 class="sec">${T("ancients")}</h2><div class="grid">${tiles("a")}</div>`;
 }else{
  body=TOPICS.map(([k])=>{const n=CARDS.filter(c=>c.tg.includes(k)).length;return `<button class="row" data-act="topic" data-v="${k}"><div><div class="rn">${esc(tn(k))}</div><div class="rc">${n} ${T("ideas")}, ${T("bothEras")}</div></div>${I("chevr")}</button>`;}).join("");
 }
 const keep=v.querySelector("#q");
 const hadFocus=keep&&document.activeElement===keep;
 v.innerHTML=`<div class="search">${I("search")}<input id="q" type="search" placeholder="${esc(T("searchPh"))}" value="${esc(q)}" autocomplete="off"></div>
  ${q?"":`<div class="seg"><button class="${mode==="thinkers"?"on":""}" data-act="mode" data-v="thinkers">${T("thinkers")}</button><button class="${mode==="topics"?"on":""}" data-act="mode" data-v="topics">${T("topics")}</button></div>`}
  <div id="xbody">${body}</div>`;
 if(hadFocus){const i=v.querySelector("#q");i.focus();i.setSelectionRange(q.length,q.length);}
}

function renderDialogues(){
 $("#v-dialogues").innerHTML=`<h2 class="sec">${T("thenNow")}</h2><div class="sub">${esc(T("duoSub"))}</div>
  <div class="rail" id="rail">${DUOS.map(d=>duoHTML(d,false)).join("")}</div>
  <div class="dots" id="dots">${DUOS.map((d,i)=>`<i class="${i===0?"on":""}"></i>`).join("")}</div>`;
 const rail=$("#rail");
 rail.addEventListener("scroll",()=>{const i=Math.round(rail.scrollLeft/(rail.firstElementChild.offsetWidth+12));document.querySelectorAll("#dots i").forEach((d,k)=>d.classList.toggle("on",k===i));},{passive:true});
}

function renderStash(){
 const rows=S.stashes.map(s=>{const n=Object.values(S.saved).filter(x=>x===s.id).length;return `<button class="row" data-act="openstash" data-v="${s.id}"><div><div class="rn">${esc(stashName(s))}</div><div class="rc">${n} ${n===1?T("idea"):T("ideas")}</div></div>${I("chevr")}</button>`;}).join("");
 const total=Object.keys(S.saved).length;
 $("#v-stash").innerHTML=`<h2 class="sec">${T("yourStashes")}</h2>
  ${total?"":`<div class="empty">${esc(T("stashEmpty"))}</div>`}
  ${rows}
  <button class="btn block" data-act="newstash">${I("plus")}${T("newStash")}</button>`;
}

function renderYou(){
 const sk=streakNow(),tl=tunedLabel(),nv=CARDS.filter(c=>c.v).length;
 $("#v-you").innerHTML=`<h2 class="sec">${T("progress")}</h2>
  <div class="stats">
   <div class="stat"><div class="n">${sk}</div><div class="l">${T("dayStreak")}</div></div>
   <div class="stat"><div class="n">${S.total}</div><div class="l">${T("ideasRead")}</div></div>
   <div class="stat"><div class="n">${Object.keys(S.saved).length}</div><div class="l">${T("ideasSaved")}</div></div>
   <div class="stat"><div class="n">${S.h.length}</div><div class="l">${T("hSignals")}</div></div>
  </div>
  <div class="tuned" style="padding-top:10px">${tl?esc(T("tuned",{x:tl})):esc(T("tunedNone"))}</div>
  <div class="vline"><span class="vchk">${I("check")}</span><span>${esc(T("verifiedCount",{v:nv,n:CARDS.length}))}</span></div>
  <h2 class="sec">${T("settings")}</h2>
  <div class="pref"><div><div class="pl">${T("dailyGoal")}</div><div class="ph">${esc(T("dailyGoalHint"))}</div></div><div class="pills">${[3,5,10].map(g=>`<button class="pill${S.goal===g?" on":""}" data-act="goal" data-v="${g}">${g}</button>`).join("")}</div></div>
  <div class="pref"><div><div class="pl">${T("look")}</div><div class="ph">${esc(T("lookHint"))}</div></div><div class="pills"><button class="pill${S.skin==="night"?" on":""}" data-act="skin" data-v="night">${T("night")}</button><button class="pill${S.skin==="silver"?" on":""}" data-act="skin" data-v="silver">${T("silver")}</button></div></div>
  <div class="pref"><div><div class="pl">${T("yourTopics")}</div><div class="ph">${S.int.length?esc(S.int.map(k=>tn(k)).join(", ")):esc(T("noneChosen"))}</div></div><button class="btn" data-act="reonboard">${T("changeBtn")}</button></div>
  <div class="pref"><div><div class="pl">${T("resetT")}</div><div class="ph">${esc(T("resetHint"))}</div></div><button class="btn danger" data-act="reset">${T("reset")}</button></div>
  <div class="about">${esc(T("about",{n:CARDS.length,t:Object.keys(THINKERS).length,d:DUOS.length}))}</div>`;
}

function renderList(){
 const Lw=cur.list;
 const cs=Lw.ids.map(byId).filter(Boolean);
 $("#v-list").innerHTML=`<button class="back" data-act="back">${I("back")}<span>${T("back")}</span></button>
  <h2 class="sec">${esc(Lw.title())}</h2>${Lw.sub?`<div class="sub">${esc(Lw.sub())}</div>`:""}
  ${cs.length?cs.map(cardHTML).join(""):`<div class="empty">${esc(Lw.empty?Lw.empty():"")}</div>`}`;
}

function render(scrollTop){
 document.querySelectorAll(".view").forEach(v=>v.classList.remove("on"));
 const id={today:"v-today",explore:"v-explore",dialogues:"v-dialogues",stash:"v-stash",you:"v-you",list:"v-list"}[cur.tab];
 if(cur.tab==="today")renderToday();
 else if(cur.tab==="explore")renderExplore($("#q")?$("#q").value:"");
 else if(cur.tab==="dialogues")renderDialogues();
 else if(cur.tab==="stash")renderStash();
 else if(cur.tab==="you")renderYou();
 else renderList();
 document.getElementById(id).classList.add("on");
 renderTabs();renderHeader();
 if(scrollTop!==false)$("#main").scrollTop=0;
 observe(document.getElementById(id));
}

function go(tab){cur.tab=tab;S.tab=tab;save();render();}
function openList(opts){cur.list=Object.assign({from:cur.tab==="list"?cur.list.from:cur.tab},opts);cur.tab="list";render();}

/* ---------- reading, streaks ---------- */
let IO=null;const timers={};
function observe(root){
 if(!("IntersectionObserver" in window))return;
 if(!IO){IO=new IntersectionObserver(es=>{es.forEach(en=>{const id=en.target.dataset.id;if(!id)return;
   if(en.intersectionRatio>=0.6){if(!timers[id])timers[id]=setTimeout(()=>{timers[id]=null;markRead(id);},1600);}
   else if(timers[id]){clearTimeout(timers[id]);timers[id]=null;}});},{root:$("#main"),threshold:[0,0.6,1]});}
 root.querySelectorAll(".card[data-id]").forEach(el=>IO.observe(el));
}
function markRead(id){
 if(S.read.includes(id))return;
 S.read.push(id);S.total++;
 if(S.td.d!==TODAY){S.streak=(S.last===YEST)?S.streak+1:1;S.td={d:TODAY,c:0};S.last=TODAY;}
 S.td.c++;save();renderHeader();
 document.querySelectorAll(`.card[data-id="${id}"] .era`).forEach(e=>e.classList.add("read"));
 if(S.td.c===S.goal)toast(T("goalToast",{s:S.streak}));
}
function refreshCard(id){
 document.querySelectorAll(`.card[data-id="${id}"]`).forEach(el=>{const open=el.classList.contains("open");const tmp=document.createElement("div");tmp.innerHTML=cardHTML(byId(id));const nu=tmp.firstElementChild;if(open)nu.classList.add("open");el.replaceWith(nu);if(IO)IO.observe(nu);});
}

/* ---------- actions ---------- */
function toast(msg,action,fn){
 const t=$("#toast");t.innerHTML=esc(msg)+(action?`<button data-act="toastact">${esc(action)}</button>`:"");t._fn=fn||null;
 t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),action?4200:2200);
}
function openSheet(mode,cardId){
 pendingSave=cardId||null;
 const curStash=cardId?S.saved[cardId]:null;
 const list=mode==="pick"?S.stashes.map(s=>`<button class="row${curStash===s.id?" on":""}" data-act="pickstash" data-v="${s.id}"><div><div class="rn">${esc(stashName(s))}</div><div class="rc">${Object.values(S.saved).filter(x=>x===s.id).length} ${T("ideas")}</div></div>${curStash===s.id?I("bm",true):""}</button>`).join(""):"";
 $("#sheet").innerHTML=`<h3>${mode==="pick"?T("saveTo"):T("newStash")}</h3>${list}
  <div class="newrow"><input id="ns" placeholder="${esc(mode==="pick"?T("orNew"):T("namePh"))}" maxlength="40"><button class="btn pri" data-act="mkstash">${T("create")}</button></div>`;
 $("#sheetwrap").classList.add("on");
 if(mode!=="pick")setTimeout(()=>{const i=$("#ns");if(i)i.focus();},50);
}
function closeSheet(){$("#sheetwrap").classList.remove("on");pendingSave=null;}
function saveTo(cardId,stashId){S.saved[cardId]=stashId;save();refreshCard(cardId);const s=S.stashes.find(x=>x.id===stashId);toast(T("savedTo",{s:stashName(s)}),T("change"),()=>openSheet("pick",cardId));if(cur.tab==="stash")renderStash();}
function share(c){
 const x=tx(c);const text=`${x.h} \u2014 ${tname(c.t)}, ${x.s}.\n${x.b}\n(Lyceum)`;
 if(navigator.share){navigator.share({title:x.h,text}).catch(()=>{});return;}
 try{navigator.clipboard.writeText(text).then(()=>toast("Copied"),()=>toast("Could not copy"));}catch(e){toast("Could not copy");}
}
function reset(){const lang=S.lang,skin=S.skin;localStorage.removeItem(KEY);S=JSON.parse(JSON.stringify(DEF));S.onb=true;S.lang=lang;S.skin=skin;save();feedN=8;go("today");toast(T("cleared"));}

document.getElementById("device").addEventListener("click",e=>{
 const el=e.target.closest("[data-act]");if(!el)return;
 const act=el.dataset.act,v=el.dataset.v,card=el.closest(".card"),id=card?card.dataset.id:null;
 switch(act){
  case "tab":go(v);break;
  case "lang":S.lang=v;save();if($("#ob").classList.contains("on"))onboard(!!S.onb);render(false);break;
  case "filter":S.filter=v;feedN=8;save();renderToday();observe($("#v-today"));break;
  case "more":feedN+=8;renderToday();observe($("#v-today"));break;
  case "deeper":card.classList.toggle("open");markRead(id);break;
  case "save":if(S.saved[id]){delete S.saved[id];save();refreshCard(id);toast(T("removed"));if(cur.tab==="list"&&cur.list.stash){cur.list.ids=cur.list.ids.filter(x=>x!==id);renderList();}}else if(S.stashes.length===1){saveTo(id,S.stashes[0].id);}else{openSheet("pick",id);}break;
  case "h":{const k=S.h.indexOf(id);if(k>=0)S.h.splice(k,1);else{S.h.push(id);markRead(id);}save();refreshCard(id);break;}
  case "share":share(byId(id));break;
  case "topic":openList({title:()=>tn(v),sub:()=>T("bothOnTheme"),ids:CARDS.filter(c=>c.tg.includes(v)).map(c=>c.id)});break;
  case "thinker":openList({title:()=>tname(v),sub:()=>`${trole(v)}, ${THINKERS[v].y}`,ids:CARDS.filter(c=>c.t===v).map(c=>c.id)});break;
  case "openone":{const duo=el.closest("[data-duo]");const ids=duo?duo.dataset.duo.split("-"):[v];const first=ids.indexOf(v);if(first>0){ids.splice(first,1);ids.unshift(v);}const d=DUOS.find(x=>ids.includes(x.a)&&ids.includes(x.v));openList({title:()=>d?`${T("thenNow")}: ${tn(d.th)}`:"",sub:()=>d?(d.br[S.lang]||d.br.en):"",ids});break;}
  case "mode":$("#v-explore").dataset.mode=v;renderExplore("");observe($("#v-explore"));break;
  case "back":cur.tab=cur.list.from||"today";render();break;
  case "openstash":{const s=S.stashes.find(x=>x.id===v);openList({title:()=>stashName(s),sub:null,ids:Object.keys(S.saved).filter(k=>S.saved[k]===v),stash:v,empty:()=>T("emptyStash")});break;}
  case "newstash":openSheet("new");break;
  case "pickstash":saveTo(pendingSave,v);closeSheet();break;
  case "mkstash":{const inp=$("#ns"),name=(inp.value||"").trim();if(!name){inp.focus();inp.placeholder=T("giveName");return;}const ns={id:"s"+Date.now(),n:name};S.stashes.push(ns);save();if(pendingSave)saveTo(pendingSave,ns.id);else{toast(T("created",{s:name}));renderStash();}closeSheet();break;}
  case "goal":S.goal=+v;save();renderYou();renderHeader();break;
  case "skin":S.skin=v;document.documentElement.dataset.skin=v;save();renderYou();break;
  case "reonboard":onboard(true);break;
  case "reset":if(el.dataset.arm){reset();}else{el.dataset.arm="1";el.textContent=T("tapAgain");setTimeout(()=>{el.removeAttribute("data-arm");el.textContent=T("reset");},3000);}break;
  case "toastact":{const t=$("#toast");t.classList.remove("on");if(t._fn)t._fn();break;}
  case "obchip":el.classList.toggle("on");break;
  case "oblang":S.lang=v;save();onboard(!!S.onb);renderHeader();break;
  case "obstart":{const sel=[...document.querySelectorAll("#ob .chip.on")].map(c=>c.dataset.v);S.int=sel;S.onb=true;S.filter=sel.length?"foryou":"all";save();$("#ob").classList.remove("on");go("today");break;}
  case "obskip":S.int=[];S.onb=true;S.filter="all";save();$("#ob").classList.remove("on");go("today");break;
 }
});
$("#sheetwrap").addEventListener("click",e=>{if(e.target.id==="sheetwrap")closeSheet();});
document.getElementById("device").addEventListener("input",e=>{if(e.target.id==="q"){renderExplore(e.target.value);observe($("#v-explore"));}});
document.getElementById("device").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="ns"){const b=$("#sheet [data-act=mkstash]");if(b)b.click();}});

function onboard(again){
 const sel=again?S.int:[...document.querySelectorAll("#ob .chip.on")].map(c=>c.dataset.v);
 $("#ob").innerHTML=`<div class="wm">Lyceum</div>
  <div class="langs" style="border:0;padding:0 0 8px">${LANGS.map(([k,l])=>`<button class="lb${S.lang===k?" on":""}" data-act="oblang" data-v="${k}">${l}</button>`).join("")}</div>
  <div class="tag">${esc(T("obTag"))}</div>
  <div class="q">${esc(T("obQ"))}</div>
  <div class="obchips">${TOPICS.map(([k])=>`<button class="chip${sel.includes(k)?" on":""}" data-act="obchip" data-v="${k}">${esc(tn(k))}</button>`).join("")}</div>
  <div class="foot"><button class="btn pri block" data-act="obstart">${again?T("saveTopics"):T("start")}</button>${again?"":`<button class="btn block" data-act="obskip">${T("skip")}</button>`}</div>`;
 $("#ob").classList.add("on");
}

/* ---------- remote cards (artifact db, written by the curator agent) ---------- */
const isNew=c=>!!c.added&&(Date.now()-Date.parse(c.added))<72*3600*1000;
/* ---------- boot ---------- */
document.documentElement.dataset.skin=S.skin||"night";
cur.tab=(S.tab&&S.tab!=="list")?S.tab:"today";
render();
if(!S.onb)onboard(false);
</script>
</body>
</html>
