   <button class="ab${hon?" on":""}" data-act="h" title="${esc(T("hHint"))}"><span class="hg">H</span><span>${hon?T("agreed"):T("agree")}</span></button>
   <button class="ab" data-act="share">${I("share")}<span>${T("share")}</span></button>
   <button class="ab deeper" data-act="deeper">${I("chev")}<span>${T("deeper")}</span></button>
  </div></article>`;
}

function duoHTML(d,mini){
 const A=byId(d.a),V=byId(d.v);
 return `<div class="duo${mini?" mini":""}" data-duo="${d.a}-${d.v}">
  <div class="duo-h">${mini?T("todayDuo"):T("thenNow")}<em>${esc(tn(d.th))}</em></div>
  <div class="duo-row">
   <button class="side then" data-act="openone" data-v="${A.id}"><div class="lbl">${T("then")}</div><div class="sw">${esc(tname(A.t))}</div><div class="si">${esc(tx(A).h)}</div></button>
   <button class="side now" data-act="openone" data-v="${V.id}"><div class="lbl">${T("now")}</div><div class="sw">${esc(tname(V.t))}</div><div class="si">${esc(tx(V).h)}</div></button>
   <div class="amp">&amp;</div>
  </div>
  <div class="bridge">${esc(d.br[S.lang]||d.br.en)}</div>
 </div>`;
}

function renderHeader(){
 const n=countToday(),g=S.goal,p=Math.min(1,n/g),C=2*Math.PI*15.5;
 $("#ring").innerHTML=`<svg viewBox="0 0 38 38"><circle class="bgc" cx="19" cy="19" r="15.5"/><circle class="fgc" cx="19" cy="19" r="15.5" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-p)).toFixed(1)}"/></svg><div class="num">${n}</div>`;
 const sk=streakNow(),st=$("#streak");
 st.className="streak"+(sk>0?(S.last===TODAY?" hot":" risk"):"");
 st.innerHTML=I("flame")+`<span>${sk}</span>`;
 $("#tagline").textContent=T("tag");
 $("#langs").innerHTML=LANGS.map(([k,l])=>`<button class="lb${S.lang===k?" on":""}" data-act="lang" data-v="${k}">${l}</button>`).join("");
 document.documentElement.lang=S.lang;
}

function renderTabs(){
 const Tb=[["today","today","home"],["explore","explore","explore"],["dialogues","dialogues","duo"],["stash","stash","bm"],["you","you","you"]];
 const active=cur.tab==="list"?(cur.list.from||"today"):cur.tab;
 $("#tabs").innerHTML=Tb.map(([k,l,ic])=>`<button class="tab${active===k?" on":""}" data-act="tab" data-v="${k}">${I(ic)}<span>${T(l)}</span></button>`).join("");
}

function renderToday(){
 const n=countToday(),g=S.goal,sk=streakNow();
 const rem=g-n;
 let line=n>=g?T("goalDone"):(sk>0?T("streakLine",{s:sk,n:rem,ideas:rem===1?T("idea"):T("ideas")}):T("startLine",{g}));
 const chips=[["foryou","foryou"],["all","all"],["valley","valley"],["ancients","ancients"]];
 const cs=feed(),show=cs.slice(0,feedN);
 const tl=tunedLabel();
 $("#v-today").innerHTML=`${T("laNote")?`<div class="lanote">${esc(T("laNote"))}</div>`:""}<div class="hero"><div class="date">${esc(dateLine())}</div>
  <div class="goal"><div class="big">${n}<span> ${esc(T("ofIdeas",{g}))}</span></div><div class="txt">${esc(line)}</div></div></div>
  ${duoHTML(todayDuo(),true)}
  <div class="chips">${chips.map(([k,l])=>`<button class="chip${S.filter===k?" on":""}" data-act="filter" data-v="${k}">${T(l)}</button>`).join("")}</div>
  ${tl?`<div class="tuned">${esc(T("tuned",{x:""})).replace(/:\s*\.$/,"")}: <b>${esc(tl)}</b>.</div>`:""}
  <div id="feed">${show.map(cardHTML).join("")}</div>
  ${cs.length>feedN?`<button class="btn block" data-act="more">${esc(T("more",{n:Math.min(8,cs.length-feedN)}))}</button>`:`<div class="end">${esc(T("end"))}</div>`}`;
}

function renderExplore(q){
 q=(q||"").trim();
 const v=$("#v-explore");
 const mode=v.dataset.mode||"thinkers";
 let body="";
 if(q){
  const ql=q.toLowerCase();
  const hits=CARDS.filter(c=>{const x=tx(c);return (x.h+" "+x.b+" "+c.h+" "+c.b+" "+tname(c.t)+" "+THINKERS[c.t].n+" "+x.s+" "+c.tg.map(k=>tn(k)).join(" ")).toLowerCase().includes(ql);});
  body=hits.length?hits.slice(0,20).map(cardHTML).join(""):`<div class="empty">${esc(T("noMatch",{q}))}</div>`;
 }else if(mode==="thinkers"){
  const tiles=w=>Object.entries(THINKERS).filter(([k,t])=>t.w===w).map(([k,t])=>{const n=CARDS.filter(c=>c.t===k).length;return `<button class="tile" data-act="thinker" data-v="${k}"><div class="av ${t.w}">${t.i}</div><div class="tn">${esc(tname(k))}</div><div class="tc">${n} ${n===1?T("idea"):T("ideas")}</div></button>`;}).join("");
  body=`<h2 class="sec">${T("valley")}</h2><div class="grid">${tiles("v")}</div><h2 class="sec">${T("ancients")}</h2><div class="grid">${tiles("a")}</div>`;
 }else{
  body=TOPICS.map(([k])=>{const n=CARDS.filter(c=>c.tg.includes(k)).length;return `<button class="row" data-act="topic" data-v="${k}"><div><div class="rn">${esc(tn(k))}</div><div class="rc">${n} ${T("ideas")}, ${T("bothEras")}</div></div>${I("chevr")}</button>`;}).join("");
 }
 const keep=v.querySelector("#q");
 const hadFocus=keep&&document.activeElement===keep;
 v.innerHTML=`<div class="search">${I("search")}<input id="q" type="search" placeholder="${esc(T("searchPh"))}" value="${esc(q)}" autocomplete="off"></div>
  ${q?"":`<div class="seg"><button class="${mode==="thinkers"?"on":""}" data-act="mode" data-v="thinkers">${T("thinkers")}</button><button class="${mode==="topics"?"on":""}" data-act="mode" data-v="topics">${T("topics")}</button></div>`}
  <div id="xbody">${body}</div>`;
 if(hadFocus){const i=v.querySelector("#q");i.focus();i.setSelectionRange(q.length,q.length);}
}

function renderDialogues(){
 $("#v-dialogues").innerHTML=`<h2 class="sec">${T("thenNow")}</h2><div class="sub">${esc(T("duoSub"))}</div>
  <div class="rail" id="rail">${DUOS.map(d=>duoHTML(d,false)).join("")}</div>
  <div class="dots" id="dots">${DUOS.map((d,i)=>`<i class="${i===0?"on":""}"></i>`).join("")}</div>`;
 const rail=$("#rail");
 rail.addEventListener("scroll",()=>{const i=Math.round(rail.scrollLeft/(rail.firstElementChild.offsetWidth+12));document.querySelectorAll("#dots i").forEach((d,k)=>d.classList.toggle("on",k===i));},{passive:true});
}

function renderStash(){
 const rows=S.stashes.map(s=>{const n=Object.values(S.saved).filter(x=>x===s.id).length;return `<button class="row" data-act="openstash" data-v="${s.id}"><div><div class="rn">${esc(stashName(s))}</div><div class="rc">${n} ${n===1?T("idea"):T("ideas")}</div></div>${I("chevr")}</button>`;}).join("");
 const total=Object.keys(S.saved).length;
 $("#v-stash").innerHTML=`<h2 class="sec">${T("yourStashes")}</h2>
  ${total?"":`<div class="empty">${esc(T("stashEmpty"))}</div>`}
  ${rows}
  <button class="btn block" data-act="newstash">${I("plus")}${T("newStash")}</button>`;
}

function renderYou(){
 const sk=streakNow(),tl=tunedLabel(),nv=CARDS.filter(c=>c.v).length;
 $("#v-you").innerHTML=`<h2 class="sec">${T("progress")}</h2>
  <div class="stats">
   <div class="stat"><div class="n">${sk}</div><div class="l">${T("dayStreak")}</div></div>
   <div class="stat"><div class="n">${S.total}</div><div class="l">${T("ideasRead")}</div></div>
   <div class="stat"><div class="n">${Object.keys(S.saved).length}</div><div class="l">${T("ideasSaved")}</div></div>
   <div class="stat"><div class="n">${S.h.length}</div><div class="l">${T("hSignals")}</div></div>
  </div>
  <div class="tuned" style="padding-top:10px">${tl?esc(T("tuned",{x:tl})):esc(T("tunedNone"))}</div>
  <div class="vline"><span class="vchk">${I("check")}</span><span>${esc(T("verifiedCount",{v:nv,n:CARDS.length}))}</span></div>
  <h2 class="sec">${T("settings")}</h2>
  <div class="pref"><div><div class="pl">${T("dailyGoal")}</div><div class="ph">${esc(T("dailyGoalHint"))}</div></div><div class="pills">${[3,5,10].map(g=>`<button class="pill${S.goal===g?" on":""}" data-act="goal" data-v="${g}">${g}</button>`).join("")}</div></div>
  <div class="pref"><div><div class="pl">${T("look")}</div><div class="ph">${esc(T("lookHint"))}</div></div><div class="pills"><button class="pill${S.skin==="night"?" on":""}" data-act="skin" data-v="night">${T("night")}</button><button class="pill${S.skin==="silver"?" on":""}" data-act="skin" data-v="silver">${T("silver")}</button></div></div>
  <div class="pref"><div><div class="pl">${T("yourTopics")}</div><div class="ph">${S.int.length?esc(S.int.map(k=>tn(k)).join(", ")):esc(T("noneChosen"))}</div></div><button class="btn" data-act="reonboard">${T("changeBtn")}</button></div>
  <div class="pref"><div><div class="pl">${T("resetT")}</div><div class="ph">${esc(T("resetHint"))}</div></div><button class="btn danger" data-act="reset">${T("reset")}</button></div>
  <div class="about">${esc(T("about",{n:CARDS.length,t:Object.keys(THINKERS).length,d:DUOS.length}))}</div>`;
}

function renderList(){
 const Lw=cur.list;
 const cs=Lw.ids.map(byId).filter(Boolean);
 $("#v-list").innerHTML=`<button class="back" data-act="back">${I("back")}<span>${T("back")}</span></button>
  <h2 class="sec">${esc(Lw.title())}</h2>${Lw.sub?`<div class="sub">${esc(Lw.sub())}</div>`:""}
  ${cs.length?cs.map(cardHTML).join(""):`<div class="empty">${esc(Lw.empty?Lw.empty():"")}</div>`}`;
}

function render(scrollTop){
 document.querySelectorAll(".view").forEach(v=>v.classList.remove("on"));
 const id={today:"v-today",explore:"v-explore",dialogues:"v-dialogues",stash:"v-stash",you:"v-you",list:"v-list"}[cur.tab];
 if(cur.tab==="today")renderToday();
 else if(cur.tab==="explore")renderExplore($("#q")?$("#q").value:"");
 else if(cur.tab==="dialogues")renderDialogues();
 else if(cur.tab==="stash")renderStash();
 else if(cur.tab==="you")renderYou();
 else renderList();
 document.getElementById(id).classList.add("on");
 renderTabs();renderHeader();
 if(scrollTop!==false)$("#main").scrollTop=0;
 observe(document.getElementById(id));
}

function go(tab){cur.tab=tab;S.tab=tab;save();render();}
function openList(opts){cur.list=Object.assign({from:cur.tab==="list"?cur.list.from:cur.tab},opts);cur.tab="list";render();}

/* ---------- reading, streaks ---------- */
let IO=null;const timers={};
function observe(root){
 if(!("IntersectionObserver" in window))return;
 if(!IO){IO=new IntersectionObserver(es=>{es.forEach(en=>{const id=en.target.dataset.id;if(!id)return;
   if(en.intersectionRatio>=0.6){if(!timers[id])timers[id]=setTimeout(()=>{timers[id]=null;markRead(id);},1600);}
   else if(timers[id]){clearTimeout(timers[id]);timers[id]=null;}});},{root:$("#main"),threshold:[0,0.6,1]});}
 root.querySelectorAll(".card[data-id]").forEach(el=>IO.observe(el));
}
function markRead(id){
 if(S.read.includes(id))return;
 S.read.push(id);S.total++;
 if(S.td.d!==TODAY){S.streak=(S.last===YEST)?S.streak+1:1;S.td={d:TODAY,c:0};S.last=TODAY;}
 S.td.c++;save();renderHeader();
 document.querySelectorAll(`.card[data-id="${id}"] .era`).forEach(e=>e.classList.add("read"));
 if(S.td.c===S.goal)toast(T("goalToast",{s:S.streak}));
}
function refreshCard(id){
 document.querySelectorAll(`.card[data-id="${id}"]`).forEach(el=>{const open=el.classList.contains("open");const tmp=document.createElement("div");tmp.innerHTML=cardHTML(byId(id));const nu=tmp.firstElementChild;if(open)nu.classList.add("open");el.replaceWith(nu);if(IO)IO.observe(nu);});
}

/* ---------- actions ---------- */
function toast(msg,action,fn){
 const t=$("#toast");t.innerHTML=esc(msg)+(action?`<button data-act="toastact">${esc(action)}</button>`:"");t._fn=fn||null;
 t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),action?4200:2200);
}
function openSheet(mode,cardId){
 pendingSave=cardId||null;
 const curStash=cardId?S.saved[cardId]:null;
 const list=mode==="pick"?S.stashes.map(s=>`<button class="row${curStash===s.id?" on":""}" data-act="pickstash" data-v="${s.id}"><div><div class="rn">${esc(stashName(s))}</div><div class="rc">${Object.values(S.saved).filter(x=>x===s.id).length} ${T("ideas")}</div></div>${curStash===s.id?I("bm",true):""}</button>`).join(""):"";
 $("#sheet").innerHTML=`<h3>${mode==="pick"?T("saveTo"):T("newStash")}</h3>${list}
  <div class="newrow"><input id="ns" placeholder="${esc(mode==="pick"?T("orNew"):T("namePh"))}" maxlength="40"><button class="btn pri" data-act="mkstash">${T("create")}</button></div>`;
 $("#sheetwrap").classList.add("on");
 if(mode!=="pick")setTimeout(()=>{const i=$("#ns");if(i)i.focus();},50);
}
function closeSheet(){$("#sheetwrap").classList.remove("on");pendingSave=null;}
function saveTo(cardId,stashId){S.saved[cardId]=stashId;save();refreshCard(cardId);const s=S.stashes.find(x=>x.id===stashId);toast(T("savedTo",{s:stashName(s)}),T("change"),()=>openSheet("pick",cardId));if(cur.tab==="stash")renderStash();}
function share(c){
 const x=tx(c);const text=`${x.h} \u2014 ${tname(c.t)}, ${x.s}.\n${x.b}\n(Lyceum)`;
 if(navigator.share){navigator.share({title:x.h,text}).catch(()=>{});return;}
 try{navigator.clipboard.writeText(text).then(()=>toast("Copied"),()=>toast("Could not copy"));}catch(e){toast("Could not copy");}
}
function reset(){const lang=S.lang,skin=S.skin;localStorage.removeItem(KEY);S=JSON.parse(JSON.stringify(DEF));S.onb=true;S.lang=lang;S.skin=skin;save();feedN=8;go("today");toast(T("cleared"));}

document.getElementById("device").addEventListener("click",e=>{
 const el=e.target.closest("[data-act]");if(!el)return;
 const act=el.dataset.act,v=el.dataset.v,card=el.closest(".card"),id=card?card.dataset.id:null;
 switch(act){
  case "tab":go(v);break;
  case "lang":S.lang=v;save();if($("#ob").classList.contains("on"))onboard(!!S.onb);render(false);break;
  case "filter":S.filter=v;feedN=8;save();renderToday();observe($("#v-today"));break;
  case "more":feedN+=8;renderToday();observe($("#v-today"));break;
  case "deeper":card.classList.toggle("open");markRead(id);break;
  case "save":if(S.saved[id]){delete S.saved[id];save();refreshCard(id);toast(T("removed"));if(cur.tab==="list"&&cur.list.stash){cur.list.ids=cur.list.ids.filter(x=>x!==id);renderList();}}else if(S.stashes.length===1){saveTo(id,S.stashes[0].id);}else{openSheet("pick",id);}break;
  case "h":{const k=S.h.indexOf(id);if(k>=0)S.h.splice(k,1);else{S.h.push(id);markRead(id);}save();refreshCard(id);break;}
  case "share":share(byId(id));break;
  case "topic":openList({title:()=>tn(v),sub:()=>T("bothOnTheme"),ids:CARDS.filter(c=>c.tg.includes(v)).map(c=>c.id)});break;
  case "thinker":openList({title:()=>tname(v),sub:()=>`${trole(v)}, ${THINKERS[v].y}`,ids:CARDS.filter(c=>c.t===v).map(c=>c.id)});break;
  case "openone":{const duo=el.closest("[data-duo]");const ids=duo?duo.dataset.duo.split("-"):[v];const first=ids.indexOf(v);if(first>0){ids.splice(first,1);ids.unshift(v);}const d=DUOS.find(x=>ids.includes(x.a)&&ids.includes(x.v));openList({title:()=>d?`${T("thenNow")}: ${tn(d.th)}`:"",sub:()=>d?(d.br[S.lang]||d.br.en):"",ids});break;}
  case "mode":$("#v-explore").dataset.mode=v;renderExplore("");observe($("#v-explore"));break;
  case "back":cur.tab=cur.list.from||"today";render();break;
  case "openstash":{const s=S.stashes.find(x=>x.id===v);openList({title:()=>stashName(s),sub:null,ids:Object.keys(S.saved).filter(k=>S.saved[k]===v),stash:v,empty:()=>T("emptyStash")});break;}
  case "newstash":openSheet("new");break;
  case "pickstash":saveTo(pendingSave,v);closeSheet();break;
  case "mkstash":{const inp=$("#ns"),name=(inp.value||"").trim();if(!name){inp.focus();inp.placeholder=T("giveName");return;}const ns={id:"s"+Date.now(),n:name};S.stashes.push(ns);save();if(pendingSave)saveTo(pendingSave,ns.id);else{toast(T("created",{s:name}));renderStash();}closeSheet();break;}
  case "goal":S.goal=+v;save();renderYou();renderHeader();break;
  case "skin":S.skin=v;document.documentElement.dataset.skin=v;save();renderYou();break;
  case "reonboard":onboard(true);break;
  case "reset":if(el.dataset.arm){reset();}else{el.dataset.arm="1";el.textContent=T("tapAgain");setTimeout(()=>{el.removeAttribute("data-arm");el.textContent=T("reset");},3000);}break;
  case "toastact":{const t=$("#toast");t.classList.remove("on");if(t._fn)t._fn();break;}
  case "obchip":el.classList.toggle("on");break;
  case "oblang":S.lang=v;save();onboard(!!S.onb);renderHeader();break;
  case "obstart":{const sel=[...document.querySelectorAll("#ob .chip.on")].map(c=>c.dataset.v);S.int=sel;S.onb=true;S.filter=sel.length?"foryou":"all";save();$("#ob").classList.remove("on");go("today");break;}
  case "obskip":S.int=[];S.onb=true;S.filter="all";save();$("#ob").classList.remove("on");go("today");break;
 }
});
$("#sheetwrap").addEventListener("click",e=>{if(e.target.id==="sheetwrap")closeSheet();});
document.getElementById("device").addEventListener("input",e=>{if(e.target.id==="q"){renderExplore(e.target.value);observe($("#v-explore"));}});
document.getElementById("device").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="ns"){const b=$("#sheet [data-act=mkstash]");if(b)b.click();}});

function onboard(again){
 const sel=again?S.int:[...document.querySelectorAll("#ob .chip.on")].map(c=>c.dataset.v);
 $("#ob").innerHTML=`<div class="wm">Lyceum</div>
  <div class="langs" style="border:0;padding:0 0 8px">${LANGS.map(([k,l])=>`<button class="lb${S.lang===k?" on":""}" data-act="oblang" data-v="${k}">${l}</button>`).join("")}</div>
  <div class="tag">${esc(T("obTag"))}</div>
  <div class="q">${esc(T("obQ"))}</div>
  <div class="obchips">${TOPICS.map(([k])=>`<button class="chip${sel.includes(k)?" on":""}" data-act="obchip" data-v="${k}">${esc(tn(k))}</button>`).join("")}</div>
  <div class="foot"><button class="btn pri block" data-act="obstart">${again?T("saveTopics"):T("start")}</button>${again?"":`<button class="btn block" data-act="obskip">${T("skip")}</button>`}</div>`;
 $("#ob").classList.add("on");
}

/* ---------- remote cards (artifact db, written by the curator agent) ---------- */
const isNew=c=>!!c.added&&(Date.now()-Date.parse(c.added))<72*3600*1000;
/* ---------- boot ---------- */
document.documentElement.dataset.skin=S.skin||"night";
cur.tab=(S.tab&&S.tab!=="list")?S.tab:"today";
render();
if(!S.onb)onboard(false);
</script>
</body>
</html>
