<!DOCTYPE html>
<html lang="en" data-skin="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lyceum — five minutes a day</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0B1426;--bg2:#0E1930;--panel:#121E39;--panel2:#182648;--line:rgba(201,206,214,.14);
  --ink:#E6E9EE;--ink2:#C9CED6;--mute:#8A94A6;--accent:#00D4FF;--accent-ink:#0B1426;--accent-soft:rgba(0,212,255,.12);
  --red:#FF3B5C;--shadow:0 10px 28px rgba(0,0,0,.35);--backdrop:#05090F;
  --serif:"Book Antiqua","Palatino Linotype",Palatino,"Iowan Old Style","Times New Roman",serif;
  --sans:Calibri,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme:light;--bg:#DDE1E7;--bg2:#E8EBEF;--panel:#F4F5F7;--panel2:#FFFFFF;--line:rgba(11,20,38,.12);
    --ink:#0B1426;--ink2:#1A2846;--mute:#5B6579;--accent:#0088BE;--accent-ink:#FFFFFF;--accent-soft:rgba(0,136,190,.12);
    --red:#D4183A;--shadow:0 10px 28px rgba(11,20,38,.14);--backdrop:#0B1426;
  }
}
:root[data-theme="light"]{
  color-scheme:light;--bg:#DDE1E7;--bg2:#E8EBEF;--panel:#F4F5F7;--panel2:#FFFFFF;--line:rgba(11,20,38,.12);
  --ink:#0B1426;--ink2:#1A2846;--mute:#5B6579;--accent:#0088BE;--accent-ink:#FFFFFF;--accent-soft:rgba(0,136,190,.12);
  --red:#D4183A;--shadow:0 10px 28px rgba(11,20,38,.14);--backdrop:#0B1426;
}
:root[data-skin="night"]{
  color-scheme:dark;--bg:#0B1426;--bg2:#0E1930;--panel:#121E39;--panel2:#182648;--line:rgba(201,206,214,.14);
  --ink:#E6E9EE;--ink2:#C9CED6;--mute:#8A94A6;--accent:#00D4FF;--accent-ink:#0B1426;--accent-soft:rgba(0,212,255,.12);
  --red:#FF3B5C;--shadow:0 10px 28px rgba(0,0,0,.35);--backdrop:#05090F;
}
:root[data-skin="silver"]{
  color-scheme:light;--bg:#DDE1E7;--bg2:#E8EBEF;--panel:#F4F5F7;--panel2:#FFFFFF;--line:rgba(11,20,38,.12);
  --ink:#0B1426;--ink2:#1A2846;--mute:#5B6579;--accent:#0088BE;--accent-ink:#FFFFFF;--accent-soft:rgba(0,136,190,.12);
  --red:#D4183A;--shadow:0 10px 28px rgba(11,20,38,.14);--backdrop:#0B1426;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

.stage{height:100%;display:flex;justify-content:center;align-items:stretch;background:var(--bg)}
.device{position:relative;width:100%;height:100%;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
@media (min-width:720px){
  body{background:var(--backdrop)}
  .stage{background:var(--backdrop);align-items:center;padding:24px}
  .device{width:414px;height:min(880px,100%);border-radius:44px;border:10px solid #182034;box-shadow:0 30px 80px rgba(0,0,0,.6)}
}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 4px;flex:0 0 auto}
.brand{font-family:var(--serif);font-size:21px;letter-spacing:.02em;color:var(--ink)}
.brand small{display:block;font-family:var(--sans);font-size:11px;letter-spacing:0;color:var(--mute);margin-top:-2px}
.hdr-right{display:flex;align-items:center;gap:12px}
.streak{display:flex;align-items:center;gap:4px;font-size:13.5px;color:var(--mute)}
.streak.hot{color:var(--accent)}
.streak.risk{color:var(--red)}
.streak svg{width:16px;height:16px}
.ringwrap{position:relative;width:38px;height:38px}
.ringwrap svg{width:38px;height:38px;transform:rotate(-90deg)}
.ringwrap .bgc{stroke:var(--line);fill:none;stroke-width:3}
.ringwrap .fgc{stroke:var(--accent);fill:none;stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset .4s ease}
.ringwrap .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-size:13px;color:var(--ink)}
.langs{display:flex;gap:4px;padding:2px 14px 6px;flex:0 0 auto;border-bottom:1px solid var(--line)}
.lb{flex:1;background:none;border:0;border-bottom:2px solid transparent;color:var(--mute);font-size:12px;letter-spacing:.08em;padding:6px 0 5px;border-radius:0}
.lb.on{color:var(--accent);border-bottom-color:var(--accent)}
.lanote{font-size:12px;color:var(--mute);padding:8px 4px 0}

/* main scroll area */
.main{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 14px 28px;scrollbar-width:none}
.main::-webkit-scrollbar{display:none}
.view{display:none}.view.on{display:block}
h2.sec{font-family:var(--serif);font-weight:400;font-size:19px;margin:22px 2px 10px;color:var(--ink)}
h2.sec:first-child{margin-top:10px}
.sub{color:var(--mute);font-size:13.5px;margin:-6px 2px 12px}

/* tabs */
.tabs{display:flex;border-top:1px solid var(--line);background:var(--bg2);flex:0 0 auto}
.tab{flex:1;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mute);font-size:11px;background:none;border:0}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--accent)}

/* today hero */
.hero{padding:8px 4px 2px}
.date{color:var(--mute);font-size:13.5px}
.goal{display:flex;align-items:center;gap:14px;margin:10px 0 4px}
.goal .big{font-family:var(--serif);font-size:30px;line-height:1.1;color:var(--ink);white-space:nowrap}
.goal .big span{font-size:17px;color:var(--mute)}
.goal .txt{font-size:13.5px;color:var(--mute);margin-top:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 4px;scrollbar-width:none;margin:8px -2px 2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--ink2);border-radius:999px;padding:7px 13px;font-size:13px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tuned{font-size:12.5px;color:var(--mute);padding:2px 4px 0}
.tuned b{color:var(--ink2);font-weight:600}

/* idea cards: two materials */
.card{border-radius:20px;padding:16px 16px 8px;margin:12px 0;position:relative}
.card.cv{background:#101C36;color:#E6E9EE;border:1px solid rgba(201,206,214,.14)}
.card.ca{background:linear-gradient(140deg,#E6E9EE 0%,#F6F7F9 42%,#C5CBD5 100%);color:#0B1426;box-shadow:var(--shadow)}
:root[data-skin="silver"] .card.cv{box-shadow:var(--shadow);border-color:transparent}
.who{display:flex;align-items:center;gap:10px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-size:14px;flex:0 0 auto}
.av.v{background:#0B1426;color:#00D4FF;box-shadow:inset 0 0 0 1.5px #00D4FF}
.av.a{background:linear-gradient(140deg,#F2F4F7,#B9C0CB);color:#0B1426}
.ca .av.a{background:#0B1426;color:#E6E9EE}
.nm{font-weight:600;font-size:14px;line-height:1.2}
.rl{font-size:11.5px;opacity:.72;margin-top:2px}
.meta{margin-left:auto;display:flex;align-items:center;gap:6px;flex:0 0 auto}
.era{font-size:11.5px;padding:3px 9px;border-radius:999px;white-space:nowrap}
.cv .era{border:1px solid rgba(201,206,214,.25);color:#C9CED6}
.ca .era{border:1px solid rgba(11,20,38,.28);color:#1A2846}
.era.read{padding-left:7px}
.era.read::before{content:"✓ "}
.vchk{width:18px;height:18px;border-radius:50%;background:#FF3B5C;color:#fff;display:grid;place-items:center;flex:0 0 auto}
.vchk svg{width:12px;height:12px}
.newb{font-size:10.5px;letter-spacing:.04em;padding:3px 7px;border-radius:999px;background:#00D4FF;color:#0B1426;font-weight:600}
.ca .newb{background:#0B1426;color:#E6E9EE}
.h{font-family:var(--serif);font-weight:400;font-size:22px;line-height:1.22;margin:14px 0 8px}
.b{font-size:15px;line-height:1.52;margin:0}
.cv .b{color:#C9CED6}
.ca .b{color:#1A2846}
.src{font-size:12.5px;font-style:italic;margin-top:10px}
.cv .src{color:#8A94A6}
.ca .src{color:#4C5669}
.tags{margin-top:6px}
.tg{display:inline-block;font-size:11.5px;padding:3px 9px;border-radius:999px;margin:6px 6px 0 0;border:0}
.cv .tg{background:rgba(0,212,255,.12);color:#00D4FF}
.ca .tg{background:rgba(11,20,38,.08);color:#0B1426}
.deep{display:none;margin-top:12px;padding:11px 12px;border-radius:0 12px 12px 0;font-size:14px;line-height:1.5}
.cv .deep{border-left:2px solid #00D4FF;background:rgba(0,212,255,.1)}
.ca .deep{border-left:2px solid #0B1426;background:rgba(11,20,38,.06)}
.deep b{display:block;font-weight:600;margin-bottom:3px}
.card.open .deep{display:block}
.acts{display:flex;gap:2px;margin-top:10px;padding-top:6px}
.cv .acts{border-top:1px solid rgba(201,206,214,.14)}
.ca .acts{border-top:1px solid rgba(11,20,38,.14)}
.ab{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:none;border:0;font-size:12.5px;padding:8px 2px;border-radius:10px}
.ab svg{width:18px;height:18px}
.ab span{white-space:nowrap}
.cv .ab{color:#8A94A6}.cv .ab.on{color:#00D4FF}
.ca .ab{color:#4C5669}.ca .ab.on{color:#0077A8}
.card.open .ab.deeper svg{transform:rotate(180deg)}
.hg{width:20px;height:20px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-family:var(--serif);font-size:13px;line-height:1;font-weight:700}
.ab.on .hg{border-color:transparent}
.cv .ab.on .hg{background:#00D4FF;color:#0B1426}
.ca .ab.on .hg{background:#0B1426;color:#E6E9EE}

/* diptych */
.duo{border-radius:20px;overflow:hidden;background:#101C36;border:1px solid rgba(201,206,214,.14);margin:12px 0;color:#E6E9EE}
:root[data-skin="silver"] .duo{box-shadow:var(--shadow);border-color:transparent}
.duo-h{padding:12px 16px 0;font-size:13px;color:#8A94A6}
.duo-h em{font-style:normal;font-family:var(--serif);font-size:17px;color:#E6E9EE;margin-left:6px}
.duo-row{display:flex;position:relative;margin-top:10px}
.side{flex:1;padding:14px 14px 16px;min-width:0;border:0;text-align:left;font-family:inherit}
.side.then{background:linear-gradient(140deg,#E6E9EE 0%,#F6F7F9 42%,#C5CBD5 100%);color:#0B1426;padding-right:28px}
.side.now{background:#101C36;color:#E6E9EE;padding-left:30px}
.duo.mini .side.then{padding-right:26px}.duo.mini .side.now{padding-left:28px}
.side .lbl{font-size:12px;opacity:.7}
.side .sw{font-weight:600;font-size:13.5px;margin-top:4px}
.side .si{font-family:var(--serif);font-size:17px;line-height:1.25;margin-top:6px}
.amp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;background:#00D4FF;color:#0B1426;display:grid;place-items:center;font-family:var(--serif);font-size:17px;box-shadow:0 0 0 4px #101C36}
.bridge{padding:12px 16px 14px;font-size:14px;line-height:1.5;color:#C9CED6;border-top:1px solid rgba(201,206,214,.14)}
.duo.mini .side{padding-top:12px;padding-bottom:14px}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 14px;scrollbar-width:none;margin:0 -2px}
.rail::-webkit-scrollbar{display:none}
.rail .duo{flex:0 0 94%;scroll-snap-align:center;margin:0}
.dots{display:flex;justify-content:center;gap:6px;margin:-4px 0 8px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}

/* explore */
.search{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:10px 0 4px}
.search svg{width:18px;height:18px;color:var(--mute);flex:0 0 auto}
.search input{flex:1;background:none;border:0;color:var(--ink);font-size:15px;outline:none;min-width:0}
.search input::placeholder{color:var(--mute)}
.seg{display:flex;background:var(--panel);border-radius:12px;padding:3px;margin:10px 0 4px}
.seg button{flex:1;text-align:center;padding:8px;border-radius:10px;font-weight:600;font-size:13px;color:var(--mute);background:none;border:0}
.seg button.on{background:var(--panel2);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 6px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.tile .av{width:44px;height:44px;font-size:15px}
.tile .tn{font-size:12.5px;font-weight:600;line-height:1.2;color:var(--ink)}
.tile .tc{font-size:11px;color:var(--mute)}
.row{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 14px;background:var(--panel);border:1px solid var(--line);border-radius:16px;margin-bottom:8px;text-align:left}
.row .rn{font-family:var(--serif);font-size:17px;color:var(--ink)}
.row .rc{font-size:12.5px;color:var(--mute);margin-top:2px}
.row svg{width:18px;height:18px;color:var(--mute);flex:0 0 auto}
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--accent);font-size:14px;padding:12px 0 2px}
.back svg{width:18px;height:18px}
.empty{color:var(--mute);font-size:14px;padding:18px 4px;line-height:1.5}

/* buttons, stats */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:11px 16px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:14px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.block{width:100%}
.btn.danger{color:var(--red);border-color:transparent;background:transparent}
.btn svg{width:18px;height:18px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat .n{font-family:var(--serif);font-size:30px;line-height:1;color:var(--ink)}
.stat .l{font-size:12.5px;color:var(--mute);margin-top:6px}
.pref{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 2px;border-bottom:1px solid var(--line)}
.pref .pl{font-size:15px}
.pref .ph{font-size:12.5px;color:var(--mute);margin-top:2px}
.pills{display:flex;gap:6px;flex:0 0 auto}
.pill{border:1px solid var(--line);background:transparent;color:var(--ink2);border-radius:999px;padding:6px 12px;font-size:13px}
.pill.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.about{color:var(--mute);font-size:12.5px;line-height:1.5;padding:16px 2px}
.vline{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);padding:10px 2px 0}

/* onboarding, sheet, toast */
.ob{position:absolute;inset:0;background:var(--bg);z-index:30;display:none;flex-direction:column;padding:34px 24px 24px;overflow:auto}
.ob.on{display:flex}
.ob .wm{font-family:var(--serif);font-size:40px;color:var(--ink)}
.ob .tag{font-family:var(--serif);font-size:19px;line-height:1.35;color:var(--ink2);margin:14px 0 26px}
.ob .q{font-size:15px;color:var(--ink);margin-bottom:10px}
.obchips{display:flex;flex-wrap:wrap;gap:8px}
.ob .foot{margin-top:auto;padding-top:26px;display:flex;flex-direction:column;gap:10px}
.sheetwrap{position:absolute;inset:0;background:rgba(5,9,15,.55);z-index:20;display:none;align-items:flex-end}
.sheetwrap.on{display:flex}
.sheet{width:100%;background:var(--bg2);border-radius:22px 22px 0 0;padding:16px 16px 18px;max-height:72%;overflow:auto}
.sheet h3{font-family:var(--serif);font-weight:400;font-size:19px;margin:4px 2px 12px;color:var(--ink)}
.sheet .row{margin-bottom:6px}
.sheet .row.on{border-color:var(--accent)}
.newrow{display:flex;gap:8px;margin-top:10px}
.newrow input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 12px;color:var(--ink);font-size:15px;min-width:0}
.toast{position:absolute;left:50%;bottom:74px;transform:translateX(-50%) translateY(8px);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:13.5px;opacity:0;pointer-events:none;transition:.22s;z-index:40;max-width:92%;display:flex;gap:12px;align-items:center;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{background:none;border:0;color:#0077A8;font-weight:600;padding:0}
:root[data-skin="silver"] .toast button{color:#00D4FF}
.end{color:var(--mute);font-size:13.5px;text-align:center;padding:18px 10px 8px;line-height:1.5}
</style>
</head>
<body>
<div class="stage"><div class="device" id="device">

  <div class="top">
    <div class="brand">Lyceum<small id="tagline">Five minutes a day</small></div>
    <div class="hdr-right">
      <div class="streak" id="streak"></div>
      <div class="ringwrap" id="ring"></div>
    </div>
  </div>
  <div class="langs" id="langs"></div>

  <div class="main" id="main">
    <section class="view" id="v-today"></section>
    <section class="view" id="v-explore"></section>
    <section class="view" id="v-dialogues"></section>
    <section class="view" id="v-stash"></section>
    <section class="view" id="v-you"></section>
    <section class="view" id="v-list"></section>
  </div>

  <nav class="tabs" id="tabs"></nav>

  <div class="ob" id="ob"></div>
  <div class="sheetwrap" id="sheetwrap"><div class="sheet" id="sheet"></div></div>
  <div class="toast" id="toast"></div>

</div></div>

<script>
/* ---------- languages ---------- */
const LANGS=[["it","ITA"],["en","ENG"],["es","ESP"],["la","LAT"]];
